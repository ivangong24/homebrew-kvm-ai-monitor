name: Sync from upstream release

# Keep this tap in lockstep with the app's latest GitHub release without any cross-repo
# credentials. Because this workflow runs inside the tap repo, it commits with the built-in
# GITHUB_TOKEN — no PAT needed. It polls hourly and can also be run manually from the Actions tab.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the latest upstream release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated so scheduled runs don't hit the 60/hr unauthenticated API rate limit (403).
          tag="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ivangong24/kvm_AI_monitor/releases/latest | jq -r .tag_name)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not read the latest release tag." >&2
            exit 1
          fi
          version="${tag#v}"
          sha="$(curl -fsSL "https://github.com/ivangong24/kvm_AI_monitor/archive/refs/tags/${tag}.tar.gz" | sha256sum | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Bump the formula and cask
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          # Formula tracks the source tag: repoint the url and its checksum.
          sed -i \
            -e "s|/archive/refs/tags/v[^\"]*\.tar\.gz|/archive/refs/tags/v${VERSION}.tar.gz|" \
            -e "s|sha256 \"[0-9a-f]*\"|sha256 \"${SHA}\"|" \
            Formula/kvm-ai-monitor.rb
          # Cask: pull the shape from the main repo at this tag (source of truth) and pin the
          # version, so cask edits there — not just version bumps — reach the tap automatically.
          curl -fsSL "https://raw.githubusercontent.com/ivangong24/kvm_AI_monitor/v${VERSION}/packaging/homebrew/Casks/kvm-ai-monitor.rb" \
            | sed "s|version \"[^\"]*\"|version \"${VERSION}\"|" > Casks/kvm-ai-monitor.rb
      - name: Commit if anything changed
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kvm-ai-monitor.rb Casks/kvm-ai-monitor.rb
          if git diff --cached --quiet; then
            echo "Already at ${VERSION}; nothing to do."
          else
            git commit -m "kvm-ai-monitor ${VERSION}"
            git push
          fi
